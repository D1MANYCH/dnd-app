<!-- Браузерный близнец `node tests/headless-node.js`: та же fixtures.js + headless.js,
     тот же набор тестов, те же числа (на этом коммите — 650 OK / 0 FAIL из 650).
     Расходятся два раннера только средой, и её выравнивают три шима ниже:
       • DOM-стабы по id — у раннера нет разметки index.html;
       • подмена history — тесты читают счётчики вызовов, а native go(-n) увёл бы страницу;
       • подкачка index.html в __indexHtmlSource — в node её инжектит fs.
     Если браузер вдруг краснит там, где node зелёный, — первым делом сверить список
     скриптов с массивом files в headless-node.js (см. «ВАЖНО» ниже), вторым — снять
     Service Worker: он отдаёт закешированные копии, и правка просто не доезжает. -->

<!-- Минимальные shims до загрузки app-кода -->
<script>
window.escapeHtml = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]});};
window.getCurrentChar = function(){ return window.__testChar || null; };
window.currentId = "test";

// ── DOM-шим: id, которых нет в разметке раннера ─────────────────────────────
// Тесты гоняют настоящие render-функции приложения, а те лезут к десяткам полей
// index.html ($ === document.getElementById, app-core.js:8). Держать здесь копию
// разметки приложения нереально, поэтому повторяем поведение node-раннера
// (tests/headless-node.js): на неизвестный id отдаём стаб и кешируем его — один
// и тот же id всегда даёт один и тот же объект, как ждут тесты. Иначе те же
// тесты краснеют в браузере на «Cannot set properties of null».
// Реальные элементы разметки в приоритете — шим включается только на null.
(function(){
  var stubs = {};
  var realGet = document.getElementById.bind(document);
  var realCreate = document.createElement.bind(document); // тесты подменяют createElement — берём оригинал
  document.getElementById = function(id){
    var el = realGet(id);
    if (el) return el;
    var key = String(id);
    if (!stubs[key]) {
      var s = realCreate("div");
      s.id = key;
      s.value = "";       // как в стабе node: поля формы читаются и до записи
      s.checked = false;
      stubs[key] = s;     // намеренно НЕ в document: querySelector не должен их видеть (как в node)
    }
    return stubs[key];
  };
  window.__gebiStubs = stubs;
  // Шим живёт только на время прогона: тесты собираются синхронно, при парсинге
  // headless.js. Дальше в браузере (в отличие от node) стреляют DOMContentLoaded/
  // load приложения, а там код рассчитывает на честный null — например
  // validateBuildOptions (character-builds.js) на нём и отваливается штатно.
  // Возврат оригинала зовёт скрипт в самом низу страницы.
  window.__restoreGetElementById = function(){ document.getElementById = realGet; };
})();

// ── SW не регистрируем ─────────────────────────────────────────────────────
// app-ui.js на load зовёт navigator.serviceWorker.register('./sw.js'). Из
// /tests/ это 404 (шум в консоли), а если раздавать раннер из корня — SW начнёт
// отдавать закешированные копии тестов и app-кода, и прогон перестанет
// показывать правку. Промис, который никогда не разрешается, глушит и то и то.
if (navigator.serviceWorker) {
  navigator.serviceWorker.register = function(){ return new Promise(function(){}); };
}

// ── источник index.html ────────────────────────────────────────────────────
// 5 fs-тестов (FIN-3/FIN-4/FIN-10/FIN-11/hb-2) сверяют разметку index.html с
// данными и читают её из window.__indexHtmlSource — node-раннер инжектит поле
// через fs. В браузере тянем сами: раннер синхронный (результаты собираются на
// парсинге headless.js), поэтому XHR тоже синхронный. Не вышло — поле остаётся
// пустым, и тесты честно пропускаются, как было до этого.
(function(){
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "../index.html", false);
    xhr.send(null);
    if (xhr.status === 200 || xhr.status === 0) window.__indexHtmlSource = xhr.responseText;
  } catch (e) { /* нет доступа (file://) — 5 fs-тестов пропустятся */ }
})();

// ── history-шим ────────────────────────────────────────────────────────────
// history-stack.js на загрузке зовёт history.pushState, а syncCloseLayer —
// history.go(-n); тесты БЛОКА 30 читают счётчики _pushCount/_lastGo, которые в
// node даёт фейк history. В браузере native go(-n) не только нечитаем, но и увёл
// бы страницу раннера с прогона. Сам объект history заменить нельзя — подменяем
// методы (state/length не трогаем: они read-only и тестам не нужны).
(function(){
  var h = window.history;
  h._pushCount = 0;
  h._lastGo = null;
  h.pushState = function(){ h._pushCount++; };
  h.replaceState = function(){};
  h.go = function(n){ h._lastGo = n; };
  h.back = function(){ h._lastGo = -1; };
  h.forward = function(){ h._lastGo = 1; };
})();
</script>
