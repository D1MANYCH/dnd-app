# TOOL-3: CI на тесты + инвариант релиза.
# Пуш в main = релиз на GitHub Pages, поэтому каждый push/PR прогоняет
# headless-тесты и сверку версий (см. CLAUDE.md «Версионирование»).
name: tests

# workflow_dispatch — ручной запуск из вкладки Actions или `gh workflow run tests.yml`.
# Нужен на случай аварий GitHub: 06–07.08.2026 throttling вебхуков (проходило ~15%
# событий) оставил четыре релизных коммита вовсе без прогонов, при этом ручной запуск
# идёт через API мимо вебхуков и работал — так был доставлен деплой pages.
on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Headless-тесты
        run: node tests/headless-node.js
      - name: Инвариант релиза (APP_VERSION ↔ APP_CHANGELOG ↔ CACHE_NAME ↔ ?v= ↔ CHANGELOG.md, подключения ↔ FILES_TO_CACHE)
        run: node tools/check-invariant.js
      - name: Автопроверки тем (синхрон light/auto, паритет dark↔light, WCAG-контраст, ratchet хардкодов)
        run: node tools/check-theme.js
