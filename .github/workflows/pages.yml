# Деплой на GitHub Pages через Actions (замена легаси-пайплайна «Deploy from a branch»).
# ТРЕБУЕТ: Settings → Pages → Build and deployment → Source = «GitHub Actions».
# Сайт статический (vanilla, без сборки) — артефакт = явный список файлов сайта (шаг «Сборка _site»), без Jekyll.
name: pages

# AUD-3 (W2): деплой только после зелёного tests на main (push или ручной запуск tests),
# красные тесты в прод не уходят. Ручной запуск pages остаётся аварийным обходом.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; начатый не отменяем, чтобы не оставить продакшен в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    # Страховка сверху: сам deploy-pages ждёт 20 минут (см. timeout ниже).
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Деплоим ровно тот коммит, который прошёл tests.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # РЕВ-5: в артефакт — только то, что нужно сайту (явный список), без tests/, docs/,
      # tools/, .claude/, *.md. История версий открывается на GitHub, не с Pages.
      - name: Сборка _site из явного списка
        run: |
          mkdir _site
          cp index.html privacy.html manifest.json style.css LICENSE *.js _site/
          cp -r assets icons vendor _site/
          rm -f _site/dev-verify-builds.js
          touch _site/.nojekyll
          # Каждый файл из FILES_TO_CACHE в sw.js обязан попасть в артефакт.
          node -e 'const fs=require("fs");const s=fs.readFileSync("sw.js","utf8");const m=s.match(/FILES_TO_CACHE\s*=\s*\[([\s\S]*?)\]/)[1].match(/["'"'"']\.\/[^"'"'"']*["'"'"']/g).map(x=>x.slice(3,-1)).filter(Boolean);const miss=m.filter(f=>!fs.existsSync("_site/"+f));if(miss.length){console.error("Нет в _site:",miss.join(", "));process.exit(1)}console.log("_site: все "+m.length+" файлов прекеша на месте")'
      # Имя артефакта уникально по попытке запуска: deploy-pages ищет артефакты по всему
      # прогону, включая прошлые попытки, и на «Re-run jobs» с общим именем падает
      # с «Multiple artifacts named "github-pages" … count is 2».
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Деплой на стороне GitHub иногда стоит в очереди дольше дефолтных 10 минут
          # (06.08.2026: «Timeout reached, aborting!» на deployment_queued, при этом
          # деплой доехал сам). 20 минут — чтобы очередь не красила прогон.
          timeout: 1200000
